services:
  mongo:
    image: mongo:7
    container_name: ledger-mongo
    restart: unless-stopped
    # Start mongod as a single-node replica set. Multi-document transactions
    # (used for atomic transaction/balance updates and transfers) REQUIRE a
    # replica set — a standalone mongod will reject startTransaction().
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialise the replica set the first time, then report healthy once the
      # node has become PRIMARY.
      test: >
        mongosh --quiet --eval '
          try { rs.status(); }
          catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] });
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
