<div class="app">
  <header>
    <h1>Transaction Ledger</h1>
    <p class="muted">Accounts · credit / debit · balances · transfers</p>
  </header>

  <main class="layout">
    <div class="left">
      <app-accounts
        [selectedId]="selected?.id ?? null"
        (accountSelected)="onSelected($event)"
        (accountsChanged)="onAccountsChanged($event)"
      ></app-accounts>

      <app-transfer
        [accounts]="accounts"
        (transferred)="refreshAll()"
      ></app-transfer>
    </div>

    <div class="right">
      <app-account-detail
        [account]="selected"
        (balanceChanged)="refreshAll()"
      ></app-account-detail>
    </div>
  </main>
</div>
